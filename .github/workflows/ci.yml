name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # The manifest must be one Zoia accepts, the image aside.
      - run: node scripts/check-manifest.js

  test:
    runs-on: ubuntu-latest
    # A hang fails here instead of holding a runner for GitHub's six hours.
    timeout-minutes: 10
    strategy:
      matrix:
        # The image runs 22.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check commit messages
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t zovivo:ci .
      - name: It starts, and refuses to run without Zoia
        # Exit code 1 and this message are src/index.js itself: the image has
        # what it needs to reach it.
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL zovivo:ci 2>&1 \
            | tee output.txt || true
          grep -q 'ZOIA_URL and ZOIA_ADDON_TOKEN' output.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and later removed is still
          # in the history, and is still compromised.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
